<!doctype html><meta charset="utf-8"><title>QWQ Builder smoke tests</title>
<body style="font:14px monospace;background:#000;color:#ddd;padding:16px"><pre id="out"></pre>
<script>
/* Тест беті: index.html-ді iframe-ге жүктеп, API-ді fetch mock-пен тексереді. Нақты API шақырылмайды. */
const out = document.getElementById("out"); let pass = 0, fail = 0;
const log = (ok, name, extra) => { ok ? pass++ : fail++; out.textContent += (ok ? "✓ " : "✗ ") + name + (extra ? "  → " + extra : "") + "\n"; };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
(async () => {
  localStorage.setItem("qwq.demo", "0"); localStorage.setItem("qwq.tour.done", "1");
  const f = document.createElement("iframe"); f.src = "../index.html"; f.style.cssText = "width:390px;height:700px;border:0"; document.body.appendChild(f);
  await new Promise((r) => (f.onload = r)); await sleep(800);
  const W = f.contentWindow, Q = W.QWQ;
  Q.store.key = "test-key"; Q.demo.active = false;
  const mock = (fn) => { W.fetch = fn; };
  const resp = (st, body, hdr) => new W.Response(typeof body === "string" ? body : JSON.stringify(body), { status: st, headers: hdr || {} });
  const expect = async (name, fn, re, code) => {
    try { await Q.api.chat({ message: "x", stream: false, tries: 1 }); log(false, name, "қате күтілген, шықпады"); }
    catch (e) { log(re.test(e.message) && (!code || e.code === code), name, e.message); }
  };
  mock(async () => resp(402, { error: "payment" })); await expect("402 → түсінікті хабар", 0, /\(402\)|Сұрау орындалмады/);
  mock(async () => resp(429, {}, { "retry-after": "1" })); await expect("429 → лимит хабары", 0, /лимит/);
  mock(async () => resp(503, {})); await expect("503 → сервер жауап бермеді", 0, /503/);
  mock(async () => resp(401, {})); await expect("401 → кілт қате", 0, /кілт/);
  mock(async () => { throw new TypeError("Failed to fetch"); }); await expect("желі қатесі → қазақша", 0, /Интернет|қосылу/);
  mock(async () => resp(200, { answer: "" })); await expect("бос жауап → хабар", 0, /бос жауап/, "empty");
  mock(async () => resp(200, "<html>not json")); await expect("JSON емес жауап → хабар", 0, /түсініксіз/);
  mock(async () => resp(200, { answer: "Сәлем" }));
  try { const r = await Q.api.chat({ message: "x", stream: false, tries: 1 }); log(r.answer === "Сәлем", "қалыпты жауап"); } catch (e) { log(false, "қалыпты жауап", e.message); }
  // идея JSON талдау
  log(!!Q.api.parseJSON('```json\n{"title":"a","prompt":"b",}\n```'), "parseJSON ақаулы JSON-ды түзетеді");
  // демо толық жүріс
  Q.demo.set(true); await Q.demo.play();
  const D = Q.store.data;
  log(D.messages.length >= 2, "демо: чат хабарламалары", D.messages.length);
  log(!!D.idea && !!D.idea.prompt, "демо: идея/промпт бар");
  log(!!D.files.plan && !!D.files.info && !!D.files.html, "демо: plan/info/html файлдары");
  log(D.versions.length >= 1, "демо: нәтиже нұсқасы", D.versions.length);
  log(/<html/i.test(D.files.html) && /<\/html>/i.test(D.files.html), "демо: HTML толық");
  log(Q.store.list().length >= 1, "чат тарихында жазба бар");
  const n0 = Q.store.list().length; Q.chats.newChat(); log(Q.store.list().length >= n0 && Q.store.data.messages.length === 0, "жаңа чат бос ашылады");
  // ---- 2-кезең: шаблонсыз жазу, көрініс және тіл тексерісі, нақтылау сұрақтары, өзгерту режимі ----
  const T = (b, c, j) => Q.template.build("T", b, c, j);
  const iss = async (h) => (await Q.check.run(h)).issues;
  const by = (id) => 'document.getElementById("' + id + '")';
  log(!Q.styles && !Q.gametpl && !/Game\.run|W\.store|W\.toast|\.tabbar/.test(T("<p>x</p>", "", "")), "ойын қозғалтқышы мен стиль кітапханасы жоқ, қабық бос");
  log((await iss(T("<div></div>", "", ""))).some((x) => /^Бет бос/.test(x)), "бос бет анықталады");
  log((await iss(T('<h1>Сәлем әлем</h1><button id="b">Бас</button>', "", by("b") + '.addEventListener("click",function(){document.title="бір"})'))).length === 0, "қалыпты бет ақаусыз");
  log((await iss(T('<canvas id="q" width="200" height="100"></canvas><button id="b">Бас</button>', "", by("b") + '.onclick=function(){document.title="a"}'))).some((x) => /^Canvas бос/.test(x)), "бос canvas анықталады");
  // тіл: ағылшын мәтін (батырма, placeholder, басқаннан кейін шыққан мәтін, alert) табылады
  const en = await iss(T('<h1>Ойын</h1><input placeholder="Enter name"><button id="b">Start</button><p id="m"></p>', "", by("b") + '.addEventListener("click",function(){' + by("m") + '.textContent="Game Over";alert("Correct!")})'));
  const enMsg = en.find((x) => /^Ағылшын мәтін/.test(x)) || "";
  log(["Start", "Enter name", "Game Over", "Correct"].every((w) => enMsg.includes(w)), "ағылшын мәтін табылады (батырма, placeholder, басқаннан кейін, alert)", enMsg.slice(0, 120));
  log((await iss(T('<h1>Ұпай: 5 · QR код · 3 km · II тоқсан</h1><button id="b">Бастау</button>', "", by("b") + '.addEventListener("click",function(){document.title="дайын"})'))).every((x) => !/^Ағылшын мәтін/.test(x)), "қазақша бет (QR, km, рим цифры) ағылшын деп белгіленбейді");
  // толық конвейер (mock модельмен): математика ойыны (ағылшын → түзетіледі), оқушы таңдау, таймер (бос бет → repair)
  await new Promise((r) => { const sc = W.document.createElement("script"); sc.src = "tests/stub.js"; sc.onload = r; W.document.body.appendChild(sc); });
  const runs = {}; for (const k of ["game", "picker", "timer"]) runs[k] = await W.QWQ_TEST.run(k);
  log(["game", "picker", "timer"].every((k) => runs[k].hasHtml && runs[k].versions === 1), "конвейер: 3 қосымша аяғына дейін өтті", JSON.stringify(["game", "picker", "timer"].map((k) => runs[k].type)));
  log(runs.game.type === "game" && runs.picker.type === "app", "ойын анықталады (тек ойын талаптары үшін)");
  log(/>Бастау</.test(runs.game.html) && !/>Start</.test(runs.game.html) && /Ұпай:/.test(runs.game.html) && runs.game.found.some((x) => /^Ағылшын мәтін/.test(x)) && runs.game.left.length === 0, "ойын: ағылшын мәтін табылып, агент қазақшаға түзетті", JSON.stringify(runs.game.left));
  log((runs.timer.calls.some((c) => c.k === "repair") || runs.timer.calls.filter((c) => c.k === "code").length >= 2) && /Сабақ таймері/.test(runs.timer.html) && runs.timer.left.length === 0, "таймер: бос/қысқа 1-нұсқа → қайта жазылды, ақаусыз", JSON.stringify(runs.timer.left));
  const code = runs.picker.calls.find((c) => c.k === "code"), plan = runs.picker.calls.find((c) => c.k === "plan");
  log(code && code.thinkingLevel === "medium" && plan && plan.thinkingLevel === "low", "ойлау: код — medium, жоспар — low", (code && code.thinkingLevel) + " / " + (plan && plan.thinkingLevel));
  log(code && /НӨЛДЕН/.test(code.message) && /ТІЛ \(ӨТЕ МАҢЫЗДЫ\)/.test(code.message) && /бос ақ аймақ/.test(code.message) && !/ШАБЛОН БЕРЕТІН|ДИЗАЙН БАҒЫТЫ|Game\.run/.test(code.message), "код промпты: нөлден, тек қазақша, толық экран, шаблонсыз");
  const fx = await Q.codegen.repair({ title: "T", brief: "x", plan: "", meta: { type: "app" }, body: "<div></div>", css: "", js: "", errors: ["Бет бос: тест"], sig: null });
  log(!!fx && /<main>/.test(fx.html), "бос бет → қатемен қайта жазу (repair) жұмыс істейді");
  const v0 = Q.store.data.versions.length;
  await Q.result.tweak("түсін көк ет");
  const D2 = Q.store.data;
  log(D2.versions.length === v0 + 1 && /#2f7dff/.test(D2.files.html) && !W.document.querySelector("#diffbar").hidden, "өзгерту: патч, дифф көрінеді, жаңа нұсқа");
  W.document.querySelector("#diff-undo").click(); await sleep(300);
  log(!/#2f7dff/.test(Q.store.data.files.html) && Q.result.verIdx() === v0 - 1, "«Қайтару» бақылау нүктесіне оралтады");
  // нақтылау сұрақтары: «Кодқа өту» → чатта чиптер («Өзің шеш» әдепкі) → жауап промптқа қосылып, агент іске қосылады
  Q.store.newChat(); Q.go("chat");
  Q.store.data.messages.push({ role: "user", content: "Математика ойынын жаса" }, { role: "assistant", content: "Жақсы идея!" }); Q.chat.renderAll();
  const IDEA_Q = { title: "Математика ойыны", summary: "Қосу ойыны.", prompt: "Математика ойыны: қосу мысалдары.", questions: [{ q: "Стиль", options: ["Қараңғы", "Жарық", "Түрлі-түсті"] }, { q: "Кімге арналған", options: ["Бастауыш", "Орта сынып", "Мұғалім"] }] };
  mock(async () => resp(200, { answer: JSON.stringify(IDEA_Q) }));
  W.document.querySelector("#make").click();
  for (let i = 0; i < 40 && !W.document.querySelector(".qcard"); i++) await sleep(50);
  const qc = W.document.querySelector(".qcard");
  const chips = qc ? [...qc.querySelectorAll(".q-row")].map((r) => [...r.querySelectorAll(".qchip")].map((b) => b.textContent)) : [];
  log(!!qc && chips.length === 2 && chips.every((c) => c[c.length - 1] === "Өзің шеш") && qc.querySelectorAll(".qchip.on").length === 2, "нақтылау: 2 сұрақ чиптермен, әрқайсысында «Өзің шеш» (әдепкі)", JSON.stringify(chips));
  if (qc) {
    [...qc.querySelectorAll(".qchip")].find((b) => b.textContent === "Жарық").click();
    qc.querySelector(".q-go .btn").click();
    await sleep(100);
    const pr = (Q.store.data.idea && Q.store.data.idea.prompt) || "";
    log(/НАҚТЫЛАУЛАРЫ/.test(pr) && /Стиль: Жарық/.test(pr) && /Кімге арналған: агент өзі шешеді/.test(pr) && Q.view === "code" && Q.code.isRunning(), "нақтылау: жауап промптқа қосылды, агент бірден іске қосылды");
    for (let i = 0; i < 200 && Q.code.isRunning(); i++) await sleep(100);
  }
  mock(async () => resp(200, { answer: JSON.stringify({ title: "Таймер", summary: "x", prompt: "Нақты тапсырма", questions: [] }) }));
  Q.store.newChat(); Q.go("chat"); Q.store.data.messages.push({ role: "user", content: "a" }, { role: "assistant", content: "b" }); Q.chat.renderAll();
  W.document.querySelector("#make").click();
  for (let i = 0; i < 40 && Q.view !== "code"; i++) await sleep(50);
  log(Q.view === "code" && !W.document.querySelector(".qcard") && !Q.code.isRunning(), "нақты промпт: сұрақсыз бірден Код бетіне");
  const editCall = W.QWQ_TEST.calls.find((c) => c.k === "edit");
  log(!!editCall && /ЖОБА КОНТЕКСТІ/.test(editCall.message) && /ЖОБА: /.test(editCall.message), "Өзгерту: агент жоба контекстін (чат, шешімдер, бұрынғы өзгертулер) алады");
  W.QWQ_TEST.restore();
  // ---- 3-кезең: чат контексті (толық тарих, нұсқа чиптері, шешімдер) ----
  let sent = [];
  const sse = (t) => new W.Response(new W.ReadableStream({ start(c) { const e = new W.TextEncoder(); c.enqueue(e.encode("data: " + JSON.stringify({ type: "delta", text: t }) + "\n\ndata: [DONE]\n\n")); c.close(); } }), { status: 200, headers: { "Content-Type": "text/event-stream" } });
  mock(async (u, o) => { const b = JSON.parse(o.body); sent.push(b); return b.stream ? sse(nextAns) : resp(200, { answer: nextAns }); });
  let nextAns = "Жақсы.";
  Q.store.newChat(); Q.go("chat");
  // 12 хабарлы чат: бірінші хабардағы талап тарихта толық жүреді
  await Q.chat.send("Маңызды талап: қосымша тек 3-сынып оқушыларына арналсын.");
  for (let i = 0; i < 5; i++) await Q.chat.send("Тағы бір сұрақ " + i);
  const h = sent[sent.length - 1].history || [];
  log(h.length === 10 && /3-сынып/.test(h[0].content), "10+ хабарлы чат: бірінші талап тарихта сақталады (соңғы 8-ге қысқартылмайды)", "history " + h.length);
  // ұзын тарих: ескі бөлігі қысқаша мазмұнмен, соңғы 20 толық
  const long = [{ role: "user", content: "Бірінші талап: түсі қызыл болсын" }]; for (let i = 0; i < 29; i++) long.push({ role: i % 2 ? "user" : "assistant", content: "хабар " + i });
  const hf = Q.chat.historyFor(long);
  log(hf.length <= 22 && /ҚЫСҚАША МАЗМҰНЫ/.test(hf[0].content) && /түсі қызыл/.test(hf[0].content) && hf[2].role === "user" && hf[hf.length - 1].content === "хабар 28", "ұзын чат: ескі бөлігінің мазмұны + соңғы 20 хабар толық", hf.length + "");
  // нұсқа чиптері: агент 3 нұсқа ұсынады → 2-сі басылады → бүкіл тарихпен «Мен 2-нұсқаны таңдадым»
  nextAns = "Үш нұсқа бар:\n\n1. **Жылдам санау** — уақытқа қосу\n2. **Ғарыш математикасы** — әр дұрыс жауап зымыранды ұшырады\n3. **Дүкен ойыны** — ақша санау\n\nҚайсысы ұнайды?";
  await Q.chat.send("Математика ойынына идея ұсын");
  const row = W.document.querySelector(".opt-row");
  const chipsT = row ? [...row.querySelectorAll(".qchip")].map((b) => b.textContent) : [];
  log(chipsT.length === 3 && /Ғарыш математикасы/.test(chipsT[1]), "нұсқалар чип болып шығады", JSON.stringify(chipsT));
  nextAns = "Керемет, **Ғарыш математикасы**: әр дұрыс жауап зымыранды жоғары көтереді.";
  sent = []; row && row.querySelectorAll(".qchip")[1].click();
  for (let i = 0; i < 40 && Q.chat.isBusy() !== false || (i < 3); i++) await sleep(50);
  for (let i = 0; i < 40 && Q.chat.isBusy(); i++) await sleep(50);
  const b2 = sent[0] || {};
  log(/Мен 2-нұсқаны таңдадым: «Ғарыш математикасы»/.test(b2.message || "") && (b2.history || []).some((m) => /Дүкен ойыны/.test(m.content)) && (b2.history || []).some((m) => /3-сынып/.test(m.content)), "чип таңдауы бүкіл тарихпен «Мен 2-нұсқаны таңдадым» түрінде кетеді");
  // Кодқа өту: таңдау мен шешімдер промпт картасына жиналады, тарих толық барады
  sent = [];
  nextAns = JSON.stringify({ title: "Ғарыш математикасы", summary: "3-сыныпқа арналған ойын", prompt: "Ғарыш математикасы ойыны.", decisions: ["Аудитория: 3-сынып", "Ойын түрі: Ғарыш математикасы"], questions: [] });
  W.document.querySelector("#make").click();
  for (let i = 0; i < 60 && Q.view !== "code"; i++) await sleep(50);
  const idea = Q.store.data.idea || {};
  const exH = (sent[0] && sent[0].history) || [];
  log(/Таңдалған нұсқа: Ғарыш математикасы/.test(idea.prompt || "") && /Аудитория: 3-сынып/.test(idea.prompt || "") && !!W.document.querySelector("#code-root .decisions") && exH.some((m) => /3-сынып оқушыларына/.test(m.content)), "Кодқа өту: таңдау мен шешімдер промпт картасында, идеяға толық чат тарихы барды", JSON.stringify(idea.decisions));
  out.textContent += `\n${pass} өтті, ${fail} құлады\n`; document.title = fail ? "FAIL" : "PASS"; window.__done = { pass, fail };
})().catch((e) => { out.textContent += "\nТЕСТ ҚАТЕСІ: " + e + "\n"; window.__done = { pass, fail: fail + 1 }; });
</script>
