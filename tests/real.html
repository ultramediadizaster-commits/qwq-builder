<!doctype html><meta charset="utf-8"><title>QWQ Builder · нақты тексеріс (3 агент іске қосуы)</title>
<body style="font:14px monospace;background:#000;color:#ddd;padding:16px">
<p>Алдымен негізгі бетте (index.html) Баптауларға API кілтін енгіз (сол сервердің origin-інде). Содан кейін «Бастау» — ойын, лендинг және құрал сұрауы НАҚТЫ агентпен іске қосылады (3 іске қосу). Нәтижелер төменде, ал әр қосымшаны фреймде көріп, скриншот ал.</p>
<button id="go" style="padding:10px 18px;font-size:15px">Бастау</button> <pre id="out"></pre>
<iframe id="app" src="../index.html" style="width:390px;height:780px;border:1px solid #333;margin-top:10px"></iframe>
<script>
const IDEAS = [
  { title: "Ғарыш қорғанысы", summary: "Ғарыштағы шапқыншыларды атып түсіретін ойын.", prompt: "Ғарыш шутері ойынын жаса: кеме төменде, жау жоғарыдан түседі, атып түсіру, ұпай, рекорд, деңгейлер, сенсорлы басқару." },
  { title: "Кофехана лендингі", summary: "Алматыдағы кофеханаға арналған лендинг бет.", prompt: "Кофехана үшін лендинг: hero, мәзір (сүзгімен), пікірлер, брондау формасы, байланыс." },
  { title: "Ипотека калькуляторы", summary: "Ай сайынғы ипотека төлемін есептейтін құрал.", prompt: "Ипотека калькуляторы: баға, алғашқы жарна, мерзім, пайыз, есептеу, тарих сақтау." },
];
const out = document.getElementById("out");
document.getElementById("go").onclick = async () => {
  const Q = document.getElementById("app").contentWindow.QWQ;
  if (!Q.store.key) { out.textContent = "API кілті жоқ: фреймдегі Баптауларда енгіз."; return; }
  Q.demo.set(false);
  for (const idea of IDEAS) {
    Q.store.newChat(); Q.store.data.idea = Object.assign({}, idea); Q.code.render();
    out.textContent += "▶ " + idea.title + " …\n";
    const t = performance.now();
    await Q.code.run();
    const D = Q.store.data, r = D.report || { left: ["есеп жоқ"] };
    out.textContent += `  түрі: ${D.meta && D.meta.type}, стиль: ${D.meta && D.meta.style}, ${((performance.now() - t) / 1000).toFixed(0)} с, қалған ақау: ${r.left.length} ${r.left.join(" | ")}\n`;
    Q.go("result");
    await new Promise((r) => setTimeout(r, 6000));   // скриншот алуға уақыт
  }
  out.textContent += "Дайын.\n";
};
</script>
