<!doctype html>
<html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QWQ роботы — тест беті</title>
<link rel="stylesheet" href="css/robot.css">
<style>
:root{color-scheme:dark}
body{margin:0;min-height:100vh;background:radial-gradient(900px 600px at 15% 0%,rgba(10,132,255,.22),transparent 60%),radial-gradient(800px 600px at 100% 100%,rgba(191,90,242,.18),transparent 60%),#000;color:#fff;font-family:Inter,system-ui,sans-serif}
.panel{position:fixed;left:16px;top:16px;z-index:10;width:min(330px,calc(100vw - 32px));box-sizing:border-box;padding:14px;border-radius:20px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.panel h1{font-size:17px;margin:0 0 4px}.panel p{margin:0 0 10px;font-size:12.5px;color:rgba(255,255,255,.65)}
.panel h2{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:#4fd6ea;margin:12px 0 6px}
.grid{display:flex;flex-wrap:wrap;gap:6px}
.grid button{min-height:40px;padding:0 12px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;font:600 13px Inter,system-ui,sans-serif;cursor:pointer}
.grid button.on{background:rgba(79,214,234,.3);border-color:#4fd6ea}
.target{position:fixed;right:12%;top:22%;width:64px;height:64px;display:grid;place-items:center;font-size:40px;filter:drop-shadow(0 0 14px #ffc83d)}
.fake-input{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);width:min(560px,calc(100vw - 32px));box-sizing:border-box;min-height:52px;padding:0 18px;border-radius:26px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;font:16px Inter,system-ui,sans-serif}
@media (max-width:600px){.panel{top:auto;bottom:16px;max-height:44vh;overflow:auto}.target{top:10%;right:10%}.fake-input{bottom:auto;top:66px}}
</style></head>
<body>
<div class="panel">
  <h1>QWQ роботы · тест беті</h1>
  <p>Барлық эмоция мен анимацияны осы жерден көресіз. Робот — суреттер (images/robot/*.webp), дыбыс: kk-KZ-DauletNeural.</p>
  <h2>Эмоциялар</h2>
  <div class="grid" id="emo">
    <button data-e="normal" class="on">Қалыпты</button><button data-e="happy">Қуанышты</button><button data-e="thinking">Ойланып тұр</button><button data-e="surprised">Таңғалған</button>
  </div>
  <h2>Суреттер (күйлер)</h2>
  <div class="grid" id="st"></div>
  <h2>Анимациялар</h2>
  <div class="grid">
    <button id="a-appear">Пайда болуы</button><button id="a-move">Жылжу</button><button id="a-point">Көрсету</button>
    <button id="a-speak">Сөйлеу (1-қадам)</button><button id="a-type">Жазу</button><button id="a-wave">Қол бұлғау</button><button id="a-bye">Қоштасу</button>
  </div>
</div>
<div class="target" id="star" aria-label="Нысана">⭐</div>
<input class="fake-input" id="inp" placeholder="Чат жолы (жазу анимациясы осында)" aria-label="Чат жолы">
<script src="js/robot.js"></script>
<script>
(function(){
  const R = QWQRobot.create(document.body);
  window.__qwqRobot = R;   // консольден сынау үшін
  const mob = () => innerWidth <= 600;
  const home = () => ({ x: mob() ? innerWidth / 2 : innerWidth * 0.55, y: mob() ? innerHeight * 0.42 : innerHeight * 0.5 });
  let bubble = null, help = null, sp = null;
  const $ = (s) => document.querySelector(s);
  const busy = (f) => async () => { try { await f(); } catch (e) { console.error(e); } };
  const setEmo = (e) => { R.emotion(e); document.querySelectorAll("#emo button").forEach((b) => b.classList.toggle("on", b.dataset.e === e)); };
  document.querySelectorAll("#emo button").forEach((b) => (b.onclick = () => setEmo(b.dataset.e)));
  const ST = { idle: "Қалыпты", happy: "Қуанышты", thinking: "Ойлану", surprised: "Таңғалу", point: "Көрсету", wave: "Қол бұлғау", talk: "Сөйлеу", fly: "Ұшу", type: "Жазу" };
  $("#st").innerHTML = QWQRobot.STATES.map((k) => `<button data-s="${k}">${ST[k]}</button>`).join("");
  $("#st").onclick = (e) => { const b = e.target.closest("[data-s]"); if (!b) return; R.show(b.dataset.s); document.querySelectorAll("#st button").forEach((x) => x.classList.toggle("on", x === b)); };
  const ensure = async () => { if (help) { help.remove(); help = null; } if (!R.el.isConnected) location.reload(); if (getComputedStyle(R.el).opacity === "0") { const h = home(); await R.appear(h.x, h.y); } };

  function placeBubble() {
    if (!bubble) return;
    const s = R.size(), p = R.pos, w = bubble.offsetWidth, h = bubble.offsetHeight;
    let x = p.x + s * 0.55, y = p.y - s * 0.7;
    if (mob() || x + w > innerWidth - 16) { x = Math.max(16, Math.min(innerWidth - w - 16, p.x - w / 2)); y = p.y - s * 0.75 - h; }
    bubble.style.left = Math.max(16, x) + "px"; bubble.style.top = Math.max(16, y) + "px";
  }
  function showBubble(step, total) {
    if (!bubble) { bubble = document.createElement("div"); bubble.className = "qwq-bubble"; bubble.setAttribute("role", "status"); bubble.setAttribute("aria-live", "polite"); document.body.appendChild(bubble); }
    bubble.innerHTML = `<div class="qb-step">${step} / ${total} · Сәлемдесу</div><div class="qb-text" id="qb-t"></div>
      <div class="qb-ctl"><button id="qb-pause" type="button">⏸ Тоқтату</button><button id="qb-mute" type="button" aria-pressed="false">🔊 Дыбыс</button>
      <button id="qb-prev" type="button" hidden>← Алдыңғысы</button><button id="qb-again" type="button" hidden>↻ Қайта түсіндір</button><button id="qb-next" class="qb-main" type="button" hidden>Әрі қарай →</button></div>`;
    placeBubble();
  }

  $("#a-appear").onclick = busy(async () => { R.el.style.opacity = "0"; const h = home(); setEmo("happy"); await R.appear(h.x, h.y); setEmo("normal"); });
  $("#a-move").onclick = busy(async () => { await ensure(); const p = R.pos, l = p.x < innerWidth / 2; await R.moveTo(l ? innerWidth * 0.75 : innerWidth * 0.3, l ? innerHeight * 0.35 : innerHeight * 0.6); placeBubble(); });
  $("#a-point").onclick = busy(async () => {
    await ensure(); const st = $("#star").getBoundingClientRect();
    await R.moveTo(Math.max(R.size() / 2 + 10, st.left - R.size() * 0.9), st.top + st.height + R.size() * 0.3);
    R.highlight($("#star")); await R.pointAt($("#star")); setEmo("happy");
    setTimeout(() => { R.unhighlight(); R.relax(); setEmo("normal"); }, 2600);
  });
  $("#a-speak").onclick = busy(async () => {
    await ensure(); setEmo("happy"); showBubble(1, 11);
    const T = $("#qb-t");
    const after = () => { ["qb-pause", "qb-mute"].forEach((i) => ($("#" + i).hidden = true)); ["qb-again", "qb-next"].forEach((i) => ($("#" + i).hidden = false)); setEmo("normal"); };
    sp = R.speak({ audio: "audio/onboarding/01.mp3", vtt: "audio/onboarding/01.vtt", onCue: (c) => { T.style.opacity = 0; setTimeout(() => { T.textContent = c.text; T.style.opacity = 1; placeBubble(); }, 120); }, onEnd: after });
    $("#qb-pause").onclick = () => { if (sp.paused) { sp.resume(); $("#qb-pause").textContent = "⏸ Тоқтату"; } else { sp.pause(); $("#qb-pause").textContent = "▶ Жалғастыру"; } };
    $("#qb-mute").onclick = (e) => { const m = !sp.muted; sp.setMuted(m); e.currentTarget.textContent = m ? "🔇 Дыбыссыз" : "🔊 Дыбыс"; e.currentTarget.setAttribute("aria-pressed", m); };
    $("#qb-again").onclick = () => $("#a-speak").click();
    $("#qb-next").onclick = () => { if (bubble) { bubble.remove(); bubble = null; } };
  });
  $("#a-type").onclick = busy(async () => {
    await ensure(); const r = $("#inp").getBoundingClientRect();
    // үстінде орын жетпесе (телефонда чат жолы жоғарыда), жолдың астына қонады
    const above = r.top - R.size() * 0.55, s = R.size();
    await R.moveTo(Math.min(innerWidth - s / 2 - 10, r.right - s * 0.3), above - s * 0.55 < 8 ? r.bottom + s * 0.62 : above);
    R.highlight($("#inp")); setEmo("normal");
    await R.typeInto($("#inp"), "Маған сабақ кестесін көрсететін қосымша керек");
    setEmo("happy"); setTimeout(() => R.unhighlight(), 1500);
  });
  $("#a-wave").onclick = busy(async () => { await ensure(); setEmo("happy"); await R.wave(2); });
  $("#a-bye").onclick = busy(async () => {
    await ensure(); if (bubble) { bubble.remove(); bubble = null; }
    const x = innerWidth - 40, y = innerHeight - 128;
    await R.bye(x, y);
    help = document.createElement("button"); help.className = "qwq-help"; help.type = "button"; help.textContent = "?"; help.setAttribute("aria-label", "Нұсқаулықты қайта бастау");
    document.body.appendChild(help);
    help.animate([{ transform: "scale(0)" }, { transform: "scale(1.15)", offset: .7 }, { transform: "scale(1)" }], { duration: 450, easing: "cubic-bezier(.34,1.56,.64,1)" });
    help.onclick = () => location.reload();
  });
  addEventListener("resize", placeBubble);
  // бет ашылғанда: пайда болу
  setTimeout(() => $("#a-appear").click(), 300);
})();
</script>
</body></html>
